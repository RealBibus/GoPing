<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoPing call engine</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #111214; overflow: hidden; font-family: Segoe UI, sans-serif; }
    #wrap { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #111214; }
    #remoteVideo { width: 100%; height: 100%; object-fit: contain; background: #000; }
    #sharePrompt { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(17,18,20,.92); z-index: 20; }
    #sharePrompt .card { background: #1e1f22; border: 1px solid #2e3035; border-radius: 14px; padding: 24px; width: min(420px, calc(100vw - 40px)); text-align: center; color: #f2f3f5; }
    #sharePrompt h2 { margin: 0 0 8px; font-size: 20px; }
    #sharePrompt p { margin: 0 0 18px; color: #b5bac1; font-size: 13px; line-height: 1.4; }
    #sharePrompt button { border: 0; border-radius: 10px; padding: 10px 16px; font-size: 14px; cursor: pointer; margin: 0 6px; }
    #shareStartBtn { background: #5865f2; color: white; }
    #shareCancelBtn { background: #2b2d31; color: #f2f3f5; }
  </style>
</head>
<body>
  <div id="wrap">
    <video id="remoteVideo" autoplay playsinline></video>
  </div>
  <div id="sharePrompt">
    <div class="card">
      <h2>Share screen</h2>
      <p>Click the button below to choose a screen or window. Browser permission is required inside the call view.</p>
      <div>
        <button id="shareStartBtn">Choose screen</button>
        <button id="shareCancelBtn">Cancel</button>
      </div>
    </div>
  </div>
  <script src="call.js"></script>
</body>
</html>
