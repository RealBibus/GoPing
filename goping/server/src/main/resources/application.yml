spring:
  application:
    name: goping
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      # The parser allows MAX_FILE_BYTES so the service can return a clean 413
      # error for oversized avatars, voice notes and media uploads.
      max-file-size: ${MAX_FILE_BYTES:52428800}
      max-request-size: ${MAX_FILE_BYTES:52428800}
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${HTTP_PORT:8080}
  shutdown: graceful
  tomcat:
    # Позволяет дочитать слишком большое тело и вернуть клиенту 413, а не оборвать соединение.
    max-swallow-size: 20MB
  error:
    whitelabel:
      enabled: false

app:
  database-path: ${DATABASE_PATH:./data/goping.db}
  jwt-secret: ${JWT_SECRET:}
  jwt-issuer: ${JWT_ISSUER:goping}
  access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
  refresh-token-ttl: ${REFRESH_TOKEN_TTL:P30D}
  upload-dir: ${UPLOAD_DIR:./data/uploads}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  max-avatar-bytes: ${MAX_AVATAR_BYTES:5242880}
  # Runtime limits. max-call-minutes = 0 means unlimited calls.
  max-text-length: ${MAX_TEXT_LENGTH:4000}
  max-voice-seconds: ${MAX_VOICE_SECONDS:300}
  max-call-minutes: ${MAX_CALL_MINUTES:0}
  max-file-bytes: ${MAX_FILE_BYTES:52428800}
  log-lines: ${LOG_LINES:400}
  auth-rate-limit: ${AUTH_RATE_LIMIT:30}
  availability-rate-limit: ${AVAILABILITY_RATE_LIMIT:120}
  cors-origins: ${CORS_ORIGINS:*}
  auto-migrate: ${AUTO_MIGRATE:true}

  # Разрешить участникам чата удалять чужие сообщения (по умолчанию включено).
  allow-delete-others-messages: ${ALLOW_DELETE_OTHERS_MESSAGES:true}

  # Секрет для выдачи серверных токенов. Пусто — админ-API выключен.
  admin-secret: ${ADMIN_SECRET:}

  # Ключ шифрования сообщений (ГОСТ 34.12-2015 «Кузнечик», CTR).
  # 64 hex-символа или Base64 от 32 байт. Пусто — ключ выводится из JWT_SECRET.
  message-key: ${MESSAGE_KEY:}

  # GitHub OAuth App (Settings -> Developer settings -> OAuth Apps).
  github-client-id: ${GITHUB_CLIENT_ID:}
  github-client-secret: ${GITHUB_CLIENT_SECRET:}
  github-callback-url: ${GITHUB_CALLBACK_URL:http://localhost:8080/api/v1/auth/github/callback}
  github-scope: ${GITHUB_SCOPE:read:user}

  # WebRTC/coturn. Без TURN звонки работают не во всех сетях.
  # Локальный coturn запускается скриптом goping/start-server.cmd (WSL).
  # Для звонков через Radmin/VPN добавьте IP этого ПК в TURN_URLS.
  turn:
    urls: ${TURN_URLS:turn:127.0.0.1:3478?transport=udp,turn:127.0.0.1:3478?transport=tcp,turn:26.68.224.240:3478?transport=udp,turn:26.68.224.240:3478?transport=tcp,turn:192.168.0.210:3478?transport=udp,turn:192.168.0.210:3478?transport=tcp}
    username: ${TURN_USERNAME:goping}
    credential: ${TURN_CREDENTIAL:gopingturn}

logging:
  level:
    root: INFO
